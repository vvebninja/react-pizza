# .github/workflows/ci-cd.yml

name: React Pizza CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'
  DIST_DIR: 'dist'

jobs:
  ci_checks:
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js Environment (NO CACHING HERE)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 2. Setup pnpm binary (needed for the next step)
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 3. CRITICAL FIX: Custom Caching for pnpm (Separate Action)
      - name: Restore pnpm cache
        uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 4. Install Dependencies
      - name: Install Dependencies
        # Only run installation if cache missed or lock file changed
        run: pnpm install --no-frozen-lockfile # Use --no-frozen-lockfile for the first run if needed
        # You can switch back to 'pnpm install --frozen-lockfile' after the first successful run
        # that generates the cache, but let's keep it simple for now.

      - name: Run Linting Check
        run: pnpm run lint

      - name: Run Build (Validation)
        run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_DIR }}
          path: ${{ env.DIST_DIR }}
          retention-days: 5

  deploy:
    # ... (deploy job remains the same, not repeated for brevity)
    name: Deploy to GitHub Pages
    needs: ci_checks
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIST_DIR }}
          path: ${{ env.DIST_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ env.DIST_DIR }}
          force_orphan: true
